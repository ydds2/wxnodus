#           INSTALLER_SHA256 为生成器从 zip 计算的 SHA-256；二者齐备后才可提交 winget-pkgs。
PackageIdentifier: yyds2.wxnodus
PackageVersion: __VERSION__
Publisher: yyds2
PackageName: WxNodus
