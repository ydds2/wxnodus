# winget manifest 模板（由 scripts/generate-package-manifests.mjs 渲染为正式 manifest）
# 字段说明：__VERSION__ / __INSTALLER_URL__ / __INSTALLER_SHA256__ / __DESCRIPTION__ 为生成器占位符。
