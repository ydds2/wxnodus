<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WxNodus CLI UI 完整设计效果 v3（紫金黑 · 2026-08-19）</title>
<style>
  /* ── 紫金黑（2026-08-19 用户选定）：紫主色 × 金色点缀 × 纯黑基底 ── */
  :root, [data-theme="dark"] {
    --bg:#0d0c14; --panel:#191627; --panel2:#211d33; --border:#3a3055;
    --text:#e5e1f2; --muted:#8f8aa8; --primary:#a78bfa; --accent:#f0c95a;
    --ok:#7fd88f; --err:#ff7b6b; --warn:#e3b341;
    --add:#17351f; --addfg:#7fd88f; --del:#4a2333; --delfg:#ff7b6b;
    --sel:#332a54; --header:#191627; --chip:#262238;
  }
  [data-theme="light"] {
    --bg:#ffffff; --panel:#f8f6fc; --panel2:#f1eefa; --border:#d8d3ea;
    --text:#1f1a2e; --muted:#6b6480; --primary:#6d28d9; --accent:#b45309;
    --ok:#107c10; --err:#c42b1c; --warn:#92600a;
    --add:#e7f6ec; --addfg:#107c10; --del:#fde9e9; --delfg:#c42b1c;
    --sel:#e9e2fa; --header:#f8f6fc; --chip:#efeaf8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace; background:#0b0a12; color:var(--text); font-size:13px; line-height:1.55; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px; }
  [data-theme="light"] body { background:#ece9f5; }
  .term { width:1060px; max-width:97vw; height:700px; max-height:95vh; background:var(--bg); border:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; position:relative; }

  .titlebar { display:flex; align-items:center; gap:8px; padding:5px 12px; background:var(--header); border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); user-select:none; }
  .dots { display:flex; gap:6px; } .dots i { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .dots i:nth-child(1){background:#e51400} .dots i:nth-child(2){background:#d4a017} .dots i:nth-child(3){background:#16825d}
  .titlebar .sp { flex:1; } .titlebar b { color:var(--text); }
  .tag { color:var(--primary); cursor:pointer; padding:0 6px; } .tag:hover { text-decoration:underline; }

  .scenes { display:flex; gap:2px; padding:3px 10px; background:var(--header); border-bottom:1px solid var(--border); overflow-x:auto; user-select:none; }
  .scenes::-webkit-scrollbar{height:3px} .scenes::-webkit-scrollbar-thumb{background:var(--border)}
  .scene { padding:1px 9px; cursor:pointer; color:var(--muted); white-space:nowrap; font-size:12px; }
  .scene:hover { color:var(--text); } .scene.act { color:var(--primary); border-bottom:2px solid var(--primary); }

  .statusbar { display:flex; align-items:center; gap:2px; padding:3px 10px; background:var(--bg); border-bottom:1px solid var(--border); font-size:12px; white-space:nowrap; overflow:hidden; user-select:none; }
  .sb-item { padding:1px 7px; color:var(--text); cursor:pointer; } .sb-item:hover { background:var(--chip); }
  .sb-item .k { color:var(--muted); } .sb-item.act { color:var(--primary); }
  .sb-mut { color:var(--muted); } .sb-cost { color:var(--warn); } .sb-sp { flex:1; }
  .pet { color:var(--primary); animation:pulse 2.4s infinite; }
  .spin { display:inline-block; animation:rot 1s linear infinite; } @keyframes rot { to{transform:rotate(360deg)} }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .cur { display:inline-block; width:8px; height:14px; background:var(--primary); vertical-align:-2px; animation:blink 1s infinite; }

  .stream { flex:1; overflow-y:auto; padding:9px 12px 6px; }
  .msg { margin-bottom:11px; max-width:800px; } .msg .role { font-weight:600; margin-bottom:2px; } .msg.user .role { color:var(--primary); } .msg.assistant .role { color:var(--accent); }
  .msg .body { white-space:pre-wrap; } .msg .meta { color:var(--muted); font-size:11px; margin-top:3px; }
  .tokbar { display:inline-flex; align-items:center; gap:6px; background:var(--chip); padding:2px 9px; font-size:11px; color:var(--muted); margin-top:4px; cursor:pointer; }
  .tokbar .g { display:inline-block; width:110px; height:6px; background:var(--panel2); overflow:hidden; }
  .tokbar .fill { display:block; height:100%; background:var(--primary); }
  .tokbar .fill.warnfill { background:var(--warn); }

  .diffblock { margin-top:6px; border:1px solid var(--border); }
  .diffblock .head { background:var(--panel2); padding:2px 10px; color:var(--muted); font-size:12px; border-bottom:1px solid var(--border); }
  .diffblock .hunk { padding:1px 10px; cursor:pointer; } .diffblock .hunk:hover { background:var(--chip); }
  .diffblock .add { background:var(--add); color:var(--addfg); } .diffblock .del { background:var(--del); color:var(--delfg); } .diffblock .ctx { color:var(--muted); }
  .diffblock .hunkhdr { color:var(--primary); background:var(--panel2); padding:1px 10px; border-top:1px solid var(--border); }
  .reviewed { color:var(--ok); }

  .inline { margin-top:8px; border-left:2px solid var(--warn); padding:6px 12px; background:var(--panel); max-width:660px; }
  .inline .q { font-weight:600; margin-bottom:4px; } .inline .opts { display:flex; gap:8px; margin-top:6px; }
  .btn { background:var(--primary); color:#fff; border:none; padding:3px 12px; cursor:pointer; font:inherit; font-size:12.5px; }
  [data-theme="light"] .btn { color:#fff; }
  .btn:hover { opacity:.85; } .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn.ghost:hover { background:var(--chip); } .btn.danger { background:var(--err); }
  .mask { background:var(--chip); color:var(--warn); padding:0 4px; }

  .toolcard { margin-top:8px; border:1px solid var(--border); background:var(--panel); }
  .toolcard .th { display:flex; align-items:center; gap:8px; padding:2px 10px; background:var(--panel2); cursor:pointer; }
  .toolcard .th .ic { color:var(--primary); } .toolcard .th.done .ic { color:var(--ok); }
  .toolcard .th .nm { font-weight:600; } .toolcard .th .args { color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toolcard .th .st { color:var(--muted); font-size:11px; }
  .toolcard .out { padding:3px 10px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); white-space:pre-wrap; max-height:130px; overflow-y:auto; display:none; }
  .toolcard.open .out { display:block; }
  .thinkbox { border-left:2px solid var(--muted); padding:4px 10px; color:var(--muted); font-size:12px; margin-top:6px; max-width:700px; display:none; }
  .thinkbox.open { display:block; }

  .prompt { display:flex; align-items:center; gap:8px; padding:6px 12px; border-top:1px solid var(--border); background:var(--bg); }
  .prompt .gt { color:var(--primary); } .prompt .text { flex:1; color:var(--text); }
  .tok-hl { color:var(--accent); } .path-hl { color:var(--ok); } .ph-hl { color:var(--warn); }
  .badge { color:var(--muted); font-size:11px; } .badge.vim { color:var(--primary); font-weight:600; }

  .popup { position:absolute; left:24px; bottom:52px; background:var(--panel); border:1px solid var(--border); min-width:340px; overflow:hidden; z-index:40; pointer-events:auto; }
  .popup .crow { display:flex; gap:10px; padding:1px 12px; cursor:pointer; } .popup .crow.on { background:var(--sel); color:#fff; }
  [data-theme="light"] .popup .crow.on { color:var(--text); }
  .popup .crow .c { color:var(--accent); min-width:110px; } .popup .crow .m { color:var(--muted); margin-left:auto; font-size:11px; }

  .overlay { position:absolute; left:0; right:0; top:0; bottom:0; pointer-events:none; }
  .workspace { position:absolute; left:0; right:0; top:44px; bottom:58px; background:var(--bg); display:flex; flex-direction:column; overflow:hidden; pointer-events:auto; }
  .ws-head { display:flex; align-items:center; gap:2px; padding:4px 12px; background:var(--header); border-bottom:1px solid var(--border); }
  .ws-tab { padding:2px 12px; cursor:pointer; color:var(--muted); } .ws-tab.act { color:var(--primary); border-bottom:2px solid var(--primary); }
  .ws-head .sp { flex:1; }
  .ws-body { flex:1; overflow-y:auto; padding:8px 12px; font-size:12.5px; }
  .ws-foot { padding:3px 12px; border-top:1px solid var(--border); background:var(--header); color:var(--muted); font-size:12px; } .ws-foot b { color:var(--text); }
  .filehdr { color:var(--accent); font-weight:600; margin:8px 0 2px; }
  .tree { border:1px solid var(--border); padding:5px 10px; } .tree .trow { padding:1px 4px; cursor:pointer; }
  .tree .trow.on { background:var(--sel); color:#fff; } [data-theme="light"] .tree .trow.on { color:var(--text); }
  .tree .trow .n { color:var(--muted); }
  .kv { display:flex; gap:10px; padding:1px 0; } .kv .k { color:var(--muted); min-width:130px; } .kv .v.ok { color:var(--ok); } .kv .v.warn { color:var(--warn); }

  .panel { position:absolute; right:0; top:44px; bottom:58px; width:350px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; pointer-events:auto; }
  .panel .ph { padding:6px 12px; border-bottom:1px solid var(--border); font-weight:600; color:var(--accent); }
  .panel .row { display:flex; align-items:center; padding:3px 12px; border-bottom:1px solid var(--border); cursor:pointer; }
  .panel .row:hover { background:var(--chip); } .panel .row .l { flex:1; } .panel .row .v { color:var(--primary); }
  .panel .row .b { color:var(--ok); } .panel .row.off .v { color:var(--muted); } .panel .row .price { color:var(--warn); font-size:11px; } .panel .row.on { background:var(--sel); }

  .modal { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); background:var(--panel); border:1px solid var(--border); border-top:2px solid var(--err); padding:14px 20px; min-width:400px; pointer-events:auto; }
  .modal .mt { font-weight:600; margin-bottom:6px; } .modal .md { color:var(--muted); margin-bottom:12px; font-size:12.5px; } .modal .opts { display:flex; gap:8px; justify-content:flex-end; }
  .modal.info { border-top-color:var(--accent); }

  .palette { position:absolute; left:50%; top:32%; transform:translate(-50%,-50%); width:520px; background:var(--panel); border:1px solid var(--border); pointer-events:auto; overflow:hidden; }
  .palette input { width:100%; background:transparent; border:none; outline:none; color:var(--text); font:inherit; padding:6px 12px; border-bottom:1px solid var(--border); }
  .palette .prow { display:flex; gap:8px; padding:2px 12px; cursor:pointer; } .palette .prow.on { background:var(--sel); color:#fff; }
  [data-theme="light"] .palette .prow.on { color:var(--text); }
  .palette .prow .c { color:var(--accent); min-width:110px; } .palette .prow .d { color:var(--muted); }

  .form { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); width:430px; background:var(--panel); border:1px solid var(--border); padding:10px 16px; pointer-events:auto; }
  .form .fr { display:flex; align-items:center; gap:8px; padding:3px 0; } .form .fr label { color:var(--muted); min-width:90px; font-size:12px; }
  .form .fr input { flex:1; background:var(--panel2); border:1px solid var(--border); color:var(--text); font:inherit; padding:3px 8px; outline:none; }
  .form .fopts { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; }

  .banner { border-left:3px solid var(--err); background:var(--panel); padding:5px 12px; margin-bottom:10px; color:var(--err); }
  .banner.ok { border-left-color:var(--ok); color:var(--ok); }
  .empty { text-align:center; color:var(--muted); padding:40px 0; } .empty .big { font-size:22px; margin-bottom:8px; }

  .steps { border:1px solid var(--border); padding:7px 12px; }
  .step { display:flex; gap:8px; padding:1px 0; } .step .s { color:var(--ok); min-width:70px; } .step.run .s { color:var(--primary); }
  .step .t { color:var(--text); } .step.run .t { color:var(--primary); }
  .receipt { margin-top:8px; border-left:3px solid var(--ok); background:var(--panel); padding:5px 12px; color:var(--ok); font-size:12px; }

  .swatches { display:flex; flex-wrap:wrap; gap:10px; padding:6px 2px; } .sw { width:150px; border:1px solid var(--border); cursor:pointer; }
  .sw:hover { border-color:var(--primary); } .sw .top { height:30px; } .sw .cap { padding:2px 8px; font-size:11px; background:var(--panel); } .sw .cap .sub { color:var(--muted); }
  .keysect { margin:6px 0 2px; color:var(--accent); font-weight:600; } .krow { display:flex; gap:8px; padding:1px 0; } .krow .k { color:var(--primary); min-width:110px; } .krow .d { color:var(--muted); }

  .help { position:absolute; bottom:58px; left:0; right:0; padding:2px 12px; background:var(--header); color:var(--muted); font-size:11px; border-top:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; user-select:none; }
  .help b { color:var(--primary); font-weight:600; }
  .toast { position:absolute; left:12px; bottom:92px; font-size:11px; color:var(--text); background:var(--panel); border-left:3px solid var(--accent); padding:4px 10px; z-index:50; }
</style>
</head>
<body>
<div class="term" id="term">
  <div class="titlebar">
    <span class="dots"><i></i><i></i><i></i></span><b>WxNodus</b><span class="sp"></span>
    <span class="tag" onclick="toggleTheme()">明暗 Ctrl+T</span><span class="tag" onclick="go('keys')">键位总览</span>
  </div>

  <div class="scenes" id="scenes"></div>

  <div class="statusbar" id="statusbar">
    <span class="sb-item act" onclick="go('sessions')"><span class="k">⎇</span> sess-7f3a <span class="sb-mut">· 商城重构</span></span>
    <span class="sb-item" onclick="go('model')"><span class="k">◈</span> deepseek-v4-pro</span>
    <span class="sb-item"><span class="k">⚿</span> smart</span>
    <span class="sb-item sb-cost">$0.0412</span>
    <span class="sb-item sb-mut" onclick="go('jobs')">⏱ 1 后台任务</span>
    <span class="sb-sp"></span><span class="pet">✦</span><span class="sb-mut">Ctrl+X 会话</span>
  </div>

  <div class="stream" id="stream"></div>

  <div class="prompt" id="prompt">
    <span class="gt">▸</span><span class="text" id="promptText"></span>
    <span class="badge vim" id="vimBadge">NORMAL</span>
    <span class="badge">@ 补全</span><span class="badge">Ctrl+P 命令</span>
  </div>

  <div class="help" id="helpbar"></div>
  <div class="overlay" id="overlay"></div>
  <div class="toast" id="toast" style="display:none"></div>
</div>

<script>
  const $ = s => document.querySelector(s);
  const SCENES = [
    ['default','① 会话全景'],['stream','② 流式输出'],['thinking','③ 推理折叠'],['tools','④ 工具执行卡'],
    ['diff','⑤ diff 工作台'],['build','⑥ 构建进度'],['sessions','⑦ 会话浏览器'],['jobs','⑧ 后台任务'],
    ['memory','⑨ 记忆收件箱'],['config','⑩ 配置面板'],['model','⑪ 模型选择'],['slash','⑫ 斜杠补全'],
    ['at','⑬ @补全'],['context','⑭ 上下文占用'],['palette','⑮ 命令面板'],['history','⑯ 历史搜索'],
    ['approve','⑰ 审批四态'],['theme','⑱ 主题画廊'],['keys','⑲ 键位'],['empty','⑳ 空态/错误'],
  ];
  let scene='default', treeOn=false, reviewed2=false, ws='diff', vimOn=true, streamIdx=0, streamTimer=null;
  const FULL_TEXT='已按需求分解为 2 个模块（auth → orders），逐模块生成完成。每个文件都经过了路径白名单与尺寸校验，验证器完成「启动 → 探活 → 重启读回」三连探活，证据链已写入 owned receipt。';
  const NAMES=Object.fromEntries(SCENES.map(([k,n])=>[k,n]));

  function toast(t){const el=$('#toast');el.style.display='block';el.textContent='✦ '+t;clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200);}
  function go(s){scene=s;if(streamTimer){clearInterval(streamTimer);streamTimer=null;}render();document.querySelectorAll('.scene').forEach(e=>e.classList.toggle('act',e.dataset.scene===s));}

  $('#scenes').innerHTML = SCENES.map(([k,n])=>`<span class="scene ${k==='default'?'act':''}" data-scene="${k}">${n}</span>`).join('');
  document.querySelectorAll('.scene').forEach(el=>el.addEventListener('click',()=>go(el.dataset.scene)));

  function streamHtml(){
    if(streamTimer){clearInterval(streamTimer);streamTimer=null;}
    if(scene==='stream'){
      streamIdx=0;
      $('#stream').innerHTML=`<div class="msg user"><div class="role">▸ 用户</div><div class="body">重构订单模块：把鉴权抽成独立模块</div></div>
        <div class="msg assistant"><div class="role">◈ assistant</div><div class="body" id="streamBody"></div>
        <div class="meta" id="streamMeta">流式 0 token · 0.0s</div>
        <span class="tokbar" onclick="toast('成本五维：推理/缓存读/缓存写/输出/输入（演示）')"><span class="g"><span class="fill" id="tokFill" style="width:0%"></span></span>上下文 0/128k</span></div>`;
      const t0=Date.now();
      streamTimer=setInterval(()=>{
        streamIdx=Math.min(streamIdx+3,FULL_TEXT.length);
        $('#streamBody').textContent=FULL_TEXT.slice(0,streamIdx)+'<span class="cur"></span>';
        const pct=Math.round(streamIdx/FULL_TEXT.length*26);
        $('#streamMeta').textContent=`流式 ${Math.round(streamIdx/1.5)} token · ${((Date.now()-t0)/1000).toFixed(1)}s`;
        $('#tokFill').style.width=pct+'%';
        if(streamIdx>=FULL_TEXT.length){clearInterval(streamTimer);streamTimer=null;$('#streamBody').innerHTML=FULL_TEXT;}
      },90);
      return '';
    }
    if(scene==='thinking'){
      return `<div class="msg user"><div class="role">▸ 用户</div><div class="body">为什么回滚 hunk 后测试没跑？</div></div>
      <div class="msg assistant"><div class="role">◈ assistant</div>
        <span class="tokbar" onclick="document.querySelector('.thinkbox').classList.toggle('open')">💭 推理过程（点击展开/折叠 · 18s）</span>
        <div class="thinkbox">先查回滚动作是否真的写盘 → 检查快照时间线 → 确认 npm test 的 cwd 与端口 → 定位到：回滚写的是旧路径，测试读的是新路径。<span class="reviewed">结论：路径不一致</span>。</div>
        <div class="body">回滚生效了，但测试脚本读的是旧文件路径——/diff revert 只回滚内容不迁移路径。建议：<b style="color:var(--primary)">rm 旧文件 + 更新 test 引用</b>。已生成修复补丁。</div>
        <div class="meta">✓ 完成 · 推理 18s · 输出 4s · 2 工具调用</div></div>`;
    }
    if(scene==='tools'){
      return `<div class="msg user"><div class="role">▸ 用户</div><div class="body">跑一下测试并列出结果</div></div>
      <div class="msg assistant"><div class="role">◈ assistant</div><div class="body">执行测试：</div>
        <div class="toolcard open" id="tc1"><div class="th" onclick="document.getElementById('tc1').classList.toggle('open')">
          <span class="ic">⏳</span><span class="nm">bash</span><span class="args">npm test -- --run</span><span class="st">运行中…</span></div>
          <div class="out">✓ 47 passed · 1 skipped<br>Tests: 48 · Duration: 3.2s</div></div>
        <div class="toolcard" id="tc2"><div class="th done" onclick="document.getElementById('tc2').classList.toggle('open')">
          <span class="ic">✓</span><span class="nm">fs_read</span><span class="args">server/auth/check.js</span><span class="st">120ms · 1.4KB</span></div>
          <div class="out">// auth middleware\nmodule.exports = check;</div></div>
        <div class="body">全部通过。工具卡可点击折叠（演示）。</div></div>`;
    }
    if(scene==='at' || scene==='slash'){ return `<div class="msg user"><div class="role">▸ 用户</div><div class="body">输入区正在演示补全弹窗（${NAMES[scene]}）——按 Tab 接受。</div></div>`; }
    if(scene==='empty'){ return `<div class="banner">✗ 模型调用失败：连接超时（检查代理或 /model set-key）</div>
      <div class="empty"><div class="big">✦</div>暂无会话——输入需求开始，或 Ctrl+X 恢复历史会话<br><span style="font-size:11px">（空态 + 错误横幅组合演示）</span></div>`; }
    return `<div class="msg user"><div class="role">▸ 用户</div><div class="body">重构订单模块：把鉴权抽成独立模块，订单服务引用它</div></div>
      <div class="msg assistant"><div class="role">◈ assistant</div><div class="body">已按需求分解为 2 个模块（auth → orders），逐模块生成完成。用 <b style="color:var(--primary)">/diff</b> 打开工作台逐 hunk 审阅：</div>
        <div class="diffblock"><div class="head">▶ server/auth/check.js（1 hunk）<span class="reviewed"> ✓</span></div>
        <div class="hunkhdr">@@ -1,3 +1,5 @@ ✓</div><div class="ctx hunk"> // auth middleware</div>
        <div class="add hunk">+const TOKEN = process.env.AUTH_TOKEN</div><div class="add hunk">+module.exports = check</div></div>
        <div class="diffblock" style="margin-top:4px"><div class="head">▶ server/index.js（2 hunks）</div>

  function applyPreset(n,p,a,b){const r=document.documentElement;

  function toggleTheme(){const d=document.documentElement.dataset;d.theme=d.theme==='light'?'dark':'light';toast('明暗：'+d.theme);}

  function render(){
    const sHtml=streamHtml();

    $('#promptText').innerHTML=promptHtml();

  }

  document.addEventListener('keydown',e=>{
    if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();toggleTheme();return;}
    if(e.ctrlKey&&e.key.toLowerCase()==='p'){e.preventDefault();go('palette');return;}
    if(e.ctrlKey&&e.key.toLowerCase()==='r'){e.preventDefault();go('history');return;}
    if(e.key==='Escape'){if(scene!=='default'){go('default');}else{vimOn=!vimOn;render();toast('vim：'+(vimOn?'NORMAL':'INSERT'));}e.preventDefault();return;}
    if(scene==='default'){
      if(e.key==='i'){vimOn=!vimOn;render();toast('vim：'+(vimOn?'NORMAL':'INSERT'));e.preventDefault();}
      else if(e.key==='d'){go('diff');e.preventDefault();}
      else if(e.key==='@'){go('at');e.preventDefault();}
      else if(e.key==='/'){go('slash');e.preventDefault();}
      return;
    }
    if(scene==='diff'){
      if(e.key==='t'){treeOn=!treeOn;render();e.preventDefault();}
      else if(e.key==='w'){switchWs(ws==='diff'?'status':ws==='status'?'doctor':'diff');e.preventDefault();}
      else if(e.key==='m'){reviewed2=!reviewed2;render();toast(reviewed2?'✓ 已标记审阅 hunk 2/2':'已取消审阅标记');e.preventDefault();}
      else if(e.key==='r'){toast('回滚确认（演示：Enter 确认 / Esc 取消）');e.preventDefault();}
    }
  });
