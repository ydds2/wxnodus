# npm 发布 workflow（A-S5）——零云端中心：发布到公共 npm registry（用户自有账号）
# 前置（仓库 Settings → Secrets and variables → Actions）：
#   NPM_TOKEN —— npm Granular/Automation token（仅授权 wxnodus / @wxnodus/sdk / @wxnodus/core）
# 发布顺序：根包 wxnodus → @wxnodus/sdk → @wxnodus/core（任一失败即停，人工重跑）
name: publish-npm

"on":
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag
        default: latest
        required: false
      dry-run:
        description: "dry-run（不真实上传）"
        default: "true"
        required: false

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.11.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run ci
      - name: pack 预检（产物清单落日志）
        run: |
          npm pack --dry-run
          pushd packages/sdk; npm pack --dry-run; popd
          pushd packages/core; npm pack --dry-run; popd
      - name: 发布 wxnodus（根包）
        run: |
          $extra = if ("${{ inputs.dry-run }}" -eq "false") { "" } else { "--dry-run" }
          npm publish --access public --tag "${{ inputs.dist-tag }}" $extra
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: 发布 @wxnodus/sdk
        run: |
          $extra = if ("${{ inputs.dry-run }}" -eq "false") { "" } else { "--dry-run" }
          pushd packages/sdk
          npm publish --access public --tag "${{ inputs.dist-tag }}" $extra
          popd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: 发布 @wxnodus/core
        run: |
          $extra = if ("${{ inputs.dry-run }}" -eq "false") { "" } else { "--dry-run" }
          pushd packages/core
          npm publish --access public --tag "${{ inputs.dist-tag }}" $extra
          popd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
