name: CI

# supremacy 2.4：GitHub Actions CI（本地已生成 + 语法校验；推送待仓库 remote 配置后自动生效）
# 门禁与本地 `npm run ci` 同源（九命令：typecheck×2 + 全量测试 + known-failures + 发现/覆盖检查 + lint + 环检查 + 构建），
# 另加 packages/vscode-ext 独立门禁（typecheck + node:test + esbuild + vsce 打包）与 vsix 工件上传。
# 注意：vscode-ext 由本工作流第 5-7 步独立门禁覆盖，根 tsconfig.tests.json 不扫 packages/vscode-ext（其
# 'vscode' 模块类型仅在自身 node_modules 中——根门禁扫描会因安装顺序而红，2026-08-18 首轮实测修复）。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 锁定与开发机一致的版本：22.23.x 出现过插件动态 import 与 CJK argv 编码差异
          # （本地 22.18.0 全绿 / CI 22.23.2 红——2026-08-18 三轮实测），版本漂移类缺陷一刀切。
          node-version: 22.18.0
          cache: npm

      - name: Install root dependencies
        run: npm install

      # ── TEMP DIAG（CI 四轮红根因取证，定位后删除）─────────────────────
      - name: TEMP-DIAG powershell unknown-command timing
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          powershell.exe -NoProfile -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('不存在的命令xyz'))) 2>&1 | Out-Null
          $sw.Stop(); Write-Output "DIAG_UNKNOWN_CJK_MS=$($sw.ElapsedMilliseconds)"
          $sw.Restart()
          powershell.exe -NoProfile -EncodedCommand ([Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('no-such-cmd-xyz'))) 2>&1 | Out-Null
          $sw.Stop(); Write-Output "DIAG_UNKNOWN_ASCII_MS=$($sw.ElapsedMilliseconds)"
          Write-Output "DIAG_PSMODULEPATH=$env:PSModulePath"
          Write-Output "DIAG_PSVER=$($PSVersionTable.PSVersion)"

      - name: TEMP-DIAG plugin dynamic import
        run: node -e "const f=require('fs'),p=require('path'),o=require('os'),u=require('url');const d=f.mkdtempSync(p.join(o.tmpdir(),'wxdiag-'));f.mkdirSync(p.join(d,'alpha'),{recursive:true});f.writeFileSync(p.join(d,'alpha','index.js'),'export const tools={alpha_hello:async()=>1};');(async()=>{for(let i=0;i<3;i++){try{const m=await import(u.pathToFileURL(p.join(d,'alpha','index.js')).href+'?t='+i);console.log('DIAG_IMPORT_OK try='+i,Object.keys(m));return;}catch(e){console.log('DIAG_IMPORT_FAIL try='+i,e.code,e.message);}}})()"
      # ── /TEMP DIAG ─────────────────────────────────────────────────────

      - name: Full local gate (npm run ci)
        run: npm run ci

      - name: Install vscode-ext dependencies
        run: npm --prefix packages/vscode-ext install

      - name: vscode-ext typecheck + tests
        run: npm --prefix packages/vscode-ext run typecheck && npm --prefix packages/vscode-ext run test

      - name: Package vscode-ext (vsix)
        run: npm --prefix packages/vscode-ext run package

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxnodus-vscode-vsix
          path: packages/vscode-ext/wxnodus-vscode.vsix
          if-no-files-found: error
